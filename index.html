<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevNext Project | Official HomePage</title>
    <meta name="description" content="静的コードを中心として開発するWeb開発組織。">
    
    <!-- Open Graph -->
    <meta property="og:title" content="DevNext Project | Official HomePage">
    <meta property="og:description" content="DevNext Projectは、2026年4月から始動した、Discordを拠点とする情報交流・支援組織です。">
    
    <!-- Twitter -->
    <meta name="twitter:title" content="DevNext Project | Official HomePage">
    <meta name="twitter:description" content="DevNext Projectは、2026年4月から始動した、Discordを拠点とする情報交流・支援組織です。">

    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://unpkg.com/lucide-static@0.516.0/font/lucide.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

    <style type="text/tailwindcss">
    @layer theme {
        :root {
            --primary: #5865F2; /* Discord Blurple */
            --primary-hover: #4752C4;
            --bg-dark: #0f1115;
            --bg-card: #1e1f24;
            --text-main: #f2f3f5;
            --text-muted: #949ba4;
        }
    }

    @layer base {
        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
        }
    }

    @layer components {
        .btn {
            @apply inline-flex items-center justify-center px-6 py-3 rounded-lg font-medium transition-colors duration-200;
        }
        .btn-primary {
            @apply bg-[var(--primary)] text-white hover:bg-[var(--primary-hover)];
        }
        .btn-outline {
            @apply border-2 border-[var(--text-muted)] text-[var(--text-main)] hover:border-[var(--text-main)] hover:bg-white/5;
        }
        .section-padding {
            @apply py-20 px-4 sm:px-6 lg:px-8 max-w-7xl mx-auto;
        }
    }
    </style>
</head>
<body class="antialiased">
    <div id="root"></div>
    
    <script type="text/babel" src="components/Header.js"></script>
    <script type="text/babel" src="components/Hero.js"></script>
    <script type="text/babel" src="components/Features.js"></script>
    <script type="text/babel" src="components/About.js"></script>
    <script type="text/babel" src="components/Team.js"></script>
    <script type="text/babel" src="components/Footer.js"></script>
    <script type="text/babel" src="app.js"></script>
</body>
</html>
